<div class="glass-cell w-20 h-20 flex items-center justify-center relative" [class.border-indigo-400]="selected">
  <canvas #canvas width="80" height="80" class="absolute inset-1 rounded-lg"></canvas>
  <span *ngIf="label" class="absolute -top-2 -right-2 text-[10px] bg-indigo-600 text-white rounded-full px-1">{{ label }}</span>
</div>
