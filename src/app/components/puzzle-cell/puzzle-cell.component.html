<div
  class="glass-cell puzzle-cell-size flex items-center justify-center relative p-[3px]"
  [class.border-indigo-400]="selected"
>
  <canvas #canvas width="200" height="200" class="block rounded-lg w-full h-full"></canvas>
  <span *ngIf="label" class="absolute -top-2 -right-2 text-[10px] bg-indigo-600 text-white rounded-full px-1">{{ label }}</span>
</div>
