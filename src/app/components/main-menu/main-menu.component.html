<section class="max-w-5xl mx-auto p-6 space-y-6">
  <div class="section-card flex flex-col gap-4">
    <h1 class="text-2xl font-semibold">Non-Verbal Reasoning Lab</h1>
    <p class="text-slate-300 text-sm leading-relaxed">
      Practice greyscale-only NVR puzzles inspired by formal assessments. Start with Classic Timed mode
      or explore future modes like survival, mastery, and puzzle labs.
    </p>
    <div class="flex gap-3 flex-wrap">
      <button class="button-primary" (click)="startClassic()">Start Classic Timed</button>
      <a routerLink="/labs" class="px-4 py-2 rounded-lg border border-slate-700 hover:border-indigo-400 transition">Open Labs</a>
    </div>
  </div>
</section>
