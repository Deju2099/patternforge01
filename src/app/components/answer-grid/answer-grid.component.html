<div class="grid grid-cols-2 md:grid-cols-4 gap-3">
  <button
    *ngFor="let ans of answers; let idx = index"
    class="focus:outline-none"
    (click)="pick(idx)"
  >
    <app-puzzle-cell
      [cell]="ans"
      [selectable]="true"
      [selected]="idx === selectedIndex"
      [label]="(idx + 1).toString()"
    ></app-puzzle-cell>
  </button>
</div>
